name: N3 P1 contracts and evidence (Linux)
on:
  push:
    branches: [feat/n3-p1-contracts-validators-20261108]
  pull_request:
    paths:
      - "src/astrochart/n3_*.py"
      - "src/astrochart/n3_contracts.schema.json"
      - "tests/test_n3_p1.py"
      - "requirements.txt"
      - ".github/workflows/n3-p1-linux.yml"
  workflow_dispatch:
jobs:
  n3-p1-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install contract validation and test dependencies (isolated)
        run: python -m pip install "pytest>=8,<10" "jsonschema>=4.23,<5"
      - name: N3 contract adversarial and evidence regression
        run: python -m pytest tests/test_n3_p1.py -q
      - name: Compile N3 modules, audit no imports in legacy UI
        run: |
          python -m compileall -q src/astrochart/n3_contracts.py src/astrochart/n3_evidence.py src/astrochart/n3_n2.py
          python - <<'PY'
          from pathlib import Path
          for module in ("interpretation.py", "synthesis.py", "semantics_n2.py", "narrative_n2.py", "ui.py"):
              assert "n3_" not in (Path("src/astrochart")/module).read_text(encoding="utf-8").lower(), module
          print("NO_N3_PRODUCTION_WIRING")
          PY
