name: N3 P1 contracts and evidence (Linux)
on:
  push:
    branches: [feat/n3-p1-contracts-validators-20261108]
  pull_request:
    paths:
      - "src/astrochart/n3_*.py"
      - "src/astrochart/n3_contracts.schema.json"
      - "tests/test_n3_p1.py"
      - "requirements.txt"
      - ".github/workflows/n3-p1-linux.yml"
  workflow_dispatch:
jobs:
  n3-p1-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install contract validation and test dependencies (isolated)
        run: python -m pip install "pytest>=8,<10" "jsonschema>=4.23,<5"
      - name: N3 contract adversarial and evidence regression
        run: python -m pytest tests/test_n3_p1.py -q
      - name: Lock PR29 immutable fixture and check HEAD drift
        run: |
          git fetch origin +refs/pull/29/head:refs/remotes/origin/pr29-p1-locked
          ACTUAL="$(git rev-parse refs/remotes/origin/pr29-p1-locked)"
          EXPECTED="d03e4c8127007b70f69e28da7708097c46f901b4"
          test "$ACTUAL" = "$EXPECTED" || { echo "PR29 HEAD DRIFT: $ACTUAL"; exit 1; }
          git show "$EXPECTED:src/astrochart/meaning_catalog_n2.json" > "$RUNNER_TEMP/n2-pr29.json"
          python scripts/n3_p1_admit_locked_pr29.py "$RUNNER_TEMP/n2-pr29.json" --locked-git-head "$EXPECTED" --report qa-output/n3-p1/pr29-locked.json
      - name: Upload N3 immutable fixture digest evidence
        uses: actions/upload-artifact@v6
        with:
          name: AstroBirthChart-N3-P1-PR29-Locked
          path: qa-output/n3-p1/pr29-locked.json
          if-no-files-found: error
      - name: Compile N3 modules, audit no imports in legacy UI
        run: |
          python -m compileall -q src/astrochart/n3_contracts.py src/astrochart/n3_evidence.py src/astrochart/n3_n2.py
          python - <<'PY'
          from pathlib import Path
          for module in ("interpretation.py", "synthesis.py", "semantics_n2.py", "narrative_n2.py", "ui.py"):
              assert "n3_" not in (Path("src/astrochart")/module).read_text(encoding="utf-8").lower(), module
          print("NO_N3_PRODUCTION_WIRING")
          PY
