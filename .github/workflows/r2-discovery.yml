name: R2 isolated discovery gates

on:
  pull_request:
    paths:
      - "src/astrochart/discovery_r2.py"
      - "tests/test_discovery_r2.py"
      - "scripts/run_r2_experiment.py"
      - "docs/interpretation-discovery-r2.md"
      - ".github/workflows/r2-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<10"
      - name: Run isolated R2 tests and real R1 synthetic experiment
        run: |
          python -m pytest -q tests/test_discovery_r2.py
          python scripts/run_r2_experiment.py --output r2-results.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r2-research-${{ matrix.os }}
          path: r2-results.json
          if-no-files-found: ignore
