name: Publish stable Windows release
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
    paths:
      - 'src/astrochart/__init__.py'
jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag equals app version and points to current main
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $version = python -c "import sys; sys.path.insert(0, 'src'); import astrochart; print(astrochart.__version__)"
          $tag = "v$version"
          if ($ref -cne "refs/heads/main" -and $ref -cne "refs/tags/$tag") {
            throw "Release ref $ref does not match expected refs/heads/main or refs/tags/$tag"
          }
          git fetch origin main
          $main = git rev-parse origin/main
          if ("${{ github.sha }}" -cne $main) { throw "Only the current main commit can become a stable release" }
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Fetch pinned JPL ephemeris
        run: python scripts/download_ephemeris.py
      - name: Run tests
        run: python -m pytest -q
      - name: Package application
        run: python -m PyInstaller --noconfirm --clean astro_app.spec
      - name: Package independent updater
        run: python -m PyInstaller --onefile --noconfirm --clean --name AstroBirthChartUpdater scripts/update_worker.py --distpath dist/update-helper --workpath build/update-helper
      - name: Add updater and version manifest
        shell: pwsh
        run: |
          python scripts/write_version.py
          Copy-Item dist/update-helper/AstroBirthChartUpdater.exe dist/AstroBirthChart/AstroBirthChartUpdater.exe
      - name: Test frozen app and updater
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/AstroBirthChart/AstroBirthChart.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Frozen app failed" }
          & dist/AstroBirthChart/AstroBirthChartUpdater.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Updater helper failed" }
          python tests/inspect_gui.py
      - name: Create release ZIP with fixed root folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AstroBirthChart -DestinationPath AstroBirthChart-Windows-x64.zip -CompressionLevel Optimal
          python scripts/verify_release_zip.py AstroBirthChart-Windows-x64.zip
          Get-FileHash AstroBirthChart-Windows-x64.zip -Algorithm SHA256
      - name: Build optional verified portable delta from previous stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $previous = gh api repos/toyro396133/astro-birth-chart-windows/releases/latest --jq .tag_name 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $previous) {
            Write-Host "No previous stable release; full ZIP remains available."
            exit 0
          }
          if ($previous -notmatch '^v[0-9]+\\.[0-9]+\\.[0-9]+        shell: pwsh
        run: choco install innosetup -y --no-progress --limit-output
      - name: Compile single-file Windows Setup.exe
        shell: pwsh
        run: |
          $version = (Get-Content dist/AstroBirthChart/version.json -Raw | ConvertFrom-Json).version
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Missing Inno Setup compiler" }
          & $iscc "/DAppVersion=$version" "installer\astrochart.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path "dist\installer\AstroBirthChart-Setup.exe")) { throw "Setup.exe missing" }
      - name: Validate actual installation, upgrade and Windows uninstall
        shell: pwsh
        run: .\scripts\test_installer.ps1
      - name: Publish release with GitHub-computed SHA256 digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import astrochart; print(astrochart.__version__)"
          $tag = "v$version"
          if (gh release view $tag 2>$null) { throw "Release $tag already exists; refusing overwrite" }
          $extra = @()
          if ("${{ github.ref_type }}" -eq "tag") { $extra += "--verify-tag" }
          $assets = @("AstroBirthChart-Windows-x64.zip", "dist/installer/AstroBirthChart-Setup.exe")
          $deltaAssets = @(Get-ChildItem -Path dist -Filter "AstroBirthChart-Delta-from-v*-to-v*.zip" -File)
          foreach ($asset in $deltaAssets) { $assets += $asset.FullName }
          gh release create $tag @assets --target "${{ github.sha }}" --title "AstroBirthChart $tag" --generate-notes @extra
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed" }
