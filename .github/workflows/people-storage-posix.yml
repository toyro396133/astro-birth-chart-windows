name: People storage POSIX

on:
  pull_request:
    paths:
      - "src/astrochart/people_storage.py"
      - "src/astrochart/chart_storage.py"
      - "tests/test_people_storage.py"
      - ".github/workflows/people-storage-posix.yml"

permissions:
  contents: read

jobs:
  people-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run POSIX people storage tests
        run: python -m pytest -q tests/test_people_storage.py
