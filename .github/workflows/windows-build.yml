name: Windows offline MVP
on:
  push:
    branches: ["feat/offline-natal-chart-mvp"]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Download and verify JPL DE440s at BUILD time
        run: python scripts/download_ephemeris.py
      - name: Run tests (includes ephemeris tests)
        run: python -m pytest -q
      - name: Produce full N1 versus N2 examples and evidence traces
        run: python scripts/n2_comparison.py
      - name: Full N2 before-versus-after paragraphs and source traces
        run: python scripts/n2_before_after.py
      - name: N2 expanded catalog full before/after on fresh computed maps
        run: python scripts/n2_catalog_impact.py
      - name: N2 expanded catalog separate sealed cohort
        run: python scripts/n2_catalog_impact.py --sealed
      - name: NEW-05 R3 full production-chain audit evidence on Windows
        run: python scripts/n2_new05_evidence.py
      - name: C29 full failing-SHA versus repaired code on 30 entirely fresh cases
        run: python scripts/n2_c29_quality.py
      - name: N2 independent JPL holdout and semantic-only comparison
        run: python scripts/n2_holdout.py
      - name: N2 untouched JPL final holdout
        run: python scripts/n2_holdout.py --sealed
      - name: New N2 acceptance seed (code frozen before inspection)
        run: python scripts/n2_acceptance.py
      - name: Independent final acceptance on a second previously unused seed
        run: python scripts/n2_acceptance.py --final
      - name: Build offline Windows EXE (one-directory / LGPL friendly)
        run: python -m PyInstaller --noconfirm --clean astro_app.spec
      - name: Bundle independent updater worker
        run: python -m PyInstaller --onefile --noconfirm --clean --name AstroBirthChartUpdater scripts/update_worker.py --distpath dist/update-helper --workpath build/update-helper
      - name: Add worker and version information to distribution
        shell: pwsh
        run: |
          python scripts/write_version.py
          Copy-Item dist/update-helper/AstroBirthChartUpdater.exe dist/AstroBirthChart/AstroBirthChartUpdater.exe
          & dist/AstroBirthChart/AstroBirthChartUpdater.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Independent updater smoke check failed" }
      - name: Smoke test frozen EXE / offline core
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/AstroBirthChart/AstroBirthChart.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Frozen EXE self-test failed: $($proc.ExitCode)" }
      - name: Smoke test graphical launch on Windows
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/AstroBirthChart/AstroBirthChart.exe" -ArgumentList "--smoke-gui" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "GUI process failed with code $($proc.ExitCode)" }
      - name: Functional GUI interaction and visual snapshots (Windows)
        run: python tests/inspect_gui.py
      - name: Generate polished sample PDF for design review (synthetic data)
        run: python scripts/preview_chart_tables_pdf.py
      - uses: actions/upload-artifact@v6
        with:
          name: AstroBirthChart-GUI-QA
          path: qa-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: AstroBirthChart-Windows-offline
          path: dist/AstroBirthChart/
          if-no-files-found: error
      - name: Create and validate downloadable Windows release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AstroBirthChart -DestinationPath AstroBirthChart-Windows-x64.zip -CompressionLevel Optimal
          python scripts/verify_release_zip.py AstroBirthChart-Windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: AstroBirthChart-Windows-Release-ZIP
          path: AstroBirthChart-Windows-x64.zip
          if-no-files-found: error

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress --limit-output
      - name: Compile single-file Windows Setup.exe
        shell: pwsh
        run: |
          $version = (Get-Content dist/AstroBirthChart/version.json -Raw | ConvertFrom-Json).version
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Missing Inno Setup compiler" }
          & $iscc "/DAppVersion=$version" "installer\astrochart.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path "dist\installer\AstroBirthChart-Setup.exe")) { throw "Setup.exe missing" }
      - name: Validate actual installation, upgrade and Windows uninstall
        shell: pwsh
        run: .\scripts\test_installer.ps1
      - name: Check if this PR introduces a new release version
        id: delta_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content dist/AstroBirthChart/version.json -Raw | ConvertFrom-Json).version
          $latest = gh api repos/toyro396133/astro-birth-chart-windows/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0) { throw "Cannot read latest release tag" }
          if ($latest -eq "v$version") {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "No version bump. Keep installer QA; skip release delta only."
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }
      - name: Build smaller registered-install Setup delta
        if: steps.delta_gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\build_setup_delta.ps1
      - name: Verify genuine previous-to-current Setup delta, tamper rejection and uninstall
        if: steps.delta_gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\test_setup_delta.ps1
      - uses: actions/upload-artifact@v6
        if: steps.delta_gate.outputs.enabled == 'true'
        with:
          name: AstroBirthChart-Windows-Setup-Delta
          path: dist/installer/AstroBirthChart-Setup-Delta-from-v*-to-v*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: AstroBirthChart-Windows-Setup-EXE
          path: dist/installer/AstroBirthChart-Setup.exe
          if-no-files-found: error
